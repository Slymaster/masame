# Masame - KataGo analysis engine config (KataGo v1.18.2, Metal backend, Apple Silicon).
# Based on cpp/configs/analysis_example.cfg from v1.18.2; tuned on an M2 Max
# (see docs/katago-benchmark.md). Only non-default values are set here.
#
# Launch:
#   katago analysis -config analysis.cfg -model <main net>.bin.gz [-human-model b18c384nbt-humanv0.bin.gz]
# Queries override per request: maxVisits, and via overrideSettings e.g.
#   {"humanSLProfile":"rank_8k","ignorePreRootHistory":false}

# Logs ------------------------------------------------------------------------------------
# No logFile/logDir/logDirDated key => KataGo writes no log file anywhere; everything goes to stderr.
logToStderr = true
logErrorsAndWarnings = true
# Unknown query fields are reported as warnings on stdout (helps catch typos in the app).
warnUnusedFields = true

# Analysis --------------------------------------------------------------------------------
reportAnalysisWinratesAs = BLACK
# Default only; the app sets maxVisits on every query.
maxVisits = 500

# Search threads, batching, GPU -----------------------------------------------------------
# Interactive use: up to 2 positions at once (e.g. main analysis + a human-policy query).
# 8 threads/position is the sweet spot on M2 Max: ~130 visits/s warm on b10c512 vs ~105 at 4
# and ~145 at 16, but 16 threads doubles the warm-up (see below).
numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 8
# Deliberately capped at 8 (< 2*8): MPSGraph compiles a new graph for every distinct batch size
# (several seconds each, not cached across process starts), so fewer batch sizes = shorter warm-up.
nnMaxBatchSize = 8

# 2^20 entries is plenty for interactive review and keeps RAM modest (example uses 2^23).
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true

# Metal: GPU-only (MPSGraph). The ANE/CoreML "mux" mode was slower on the transformer nets
# and re-converts the model to CoreML on every start (~80 s), see docs/katago-benchmark.md.
numNNServerThreadsPerModel = 1
metalDeviceToUseThread0 = 0

# Human SL model (-human-model) -----------------------------------------------------------
# Nothing human-specific is set here on purpose: with no humanSLProfile in the config, the
# main net drives the search and the app picks humanSLProfile per query (overrideSettings),
# plus includePolicy=true to receive humanPolicy. For imitation, also send
# "ignorePreRootHistory":false (humans react to recent moves). The batch/thread settings
# above apply to both loaded models.
