[package]
name = "baduk"
version = "0.4.0"
edition = "2021"

[lib]
name = "baduk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["http2", "stream"] }
futures-util = { version = "0.3", default-features = false }
sha2 = "0.10"
getrandom = "0.4" # PKCE verifier and OAuth state
base64 = "0.23"
# OGS tokens in the OS keychain. Linux: the blocking libdbus Secret Service client (libdbus is already linked by tao), not the zbus one, which brings its own runtime.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "fs", "macros", "rt-multi-thread", "time", "net"] }

# Self-update: desktop only (the stores update the phone apps).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "~2.13", default-features = false, features = ["rustls-tls"] }

# TLS: rustls everywhere but iOS, where Apple's TLS keeps the app on the OS's encryption only (export compliance).
[target.'cfg(not(target_os = "ios"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
[target.'cfg(target_os = "ios")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
# App activity observers and the iCloud backup flag (src/ios.rs); already in the dependency tree via tao.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSError", "NSNotification", "NSOperation", "NSString", "NSURL", "NSValue"] }
block2 = "0.6"

# Links open through the system on phones; Android's rustls verifier asks the OS trust store through the JVM.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-opener = "2"
[target.'cfg(target_os = "android")'.dependencies]
rustls-platform-verifier = "0.7"
jni = { version = "0.22", default-features = false }
ndk-context = "0.1"

# Engine process (job object, error mode, OpenCL.dll check) and opening the credit links; already in the dependency tree via tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
# A second launch (double-clicking an SGF) hands its files to the running window. Not on Linux, where it needs zbus (see keyring).
tauri-plugin-single-instance = "2"

# The mock runtime, for the (ignored) TLS test that runs the updater next to our own client.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
