[package]
name = "masame-ogs-auth-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
sha2 = "0.10"
getrandom = "0.4"
base64 = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }

# Compile-check the production JNI bridge on the host. These tests never initialize or read an Android vault.
jni = { version = "0.22", default-features = false }
ndk-context = "0.1"
