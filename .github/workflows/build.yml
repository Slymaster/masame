# Tests and builds for macOS (Apple Silicon: .app + .dmg; ad-hoc signed, Developer ID signed and notarized on v* tags),
# Windows x64 (NSIS installer, unsigned) and Linux x86_64 (AppImage, .deb, .rpm; built on Ubuntu 22.04 for a glibc 2.35
# baseline) on every push and pull request.
# On a v* tag push only, the packages are uploaded as workflow artifacts and the release job turns them into a draft
# GitHub release (with SHA256SUMS.txt) for the maintainer to review and publish by hand. Actions are pinned to commit
# SHAs (tag in the comment); pnpm's exact version comes from package.json's packageManager field.
# Tag builds also sign the updater packages with the key held by the `release` environment (restricted to v* tags) and
# the release job publishes latest.json, which the app's updater reads; other builds neither need nor see the key.
# The same environment holds the Developer ID certificate and the App Store Connect API key: macOS tag builds sign the
# app, KataGo and the DMG with them, have Apple notarize the app and the DMG, staple both and check the result.
name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    # The updater and Apple signing secrets live in this environment; no environment (empty name) for other refs.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # Tauri 2's WebKitGTK stack (and patchelf for the AppImage), then the engine's build dependencies.
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf \
            ninja-build cmake zlib1g-dev libeigen3-dev ocl-icd-opencl-dev opencl-headers

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build # dist/ must exist before cargo compiles the app (generate_context!)

      # The engine must be in place before cargo runs: tauri-build checks bundled binaries and resources.
      - name: Cache the KataGo build (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: katago-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-katago.sh') }}
      - name: Build KataGo (macOS, Metal)
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkg-config
          scripts/build-katago.sh
      - name: Cache the KataGo build (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: katago-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-katago-linux.sh') }}
      - name: Build KataGo (Linux, OpenCL + CPU)
        if: runner.os == 'Linux'
        run: scripts/build-katago-linux.sh
      - name: Fetch KataGo (Windows, official OpenCL + CPU builds)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-windows-engine.ps1

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      # Tags only: updater packages (.app.tar.gz, setup.exe, AppImage) signed with the key; without it the build fails.
      # macOS tag builds use the next step instead: Tauri reads APPLE_* variables even when empty, so ad-hoc builds
      # must not have them at all.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS') }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }}${{ startsWith(github.ref, 'refs/tags/v') && ' --config ''{"bundle":{"createUpdaterArtifacts":true}}''' || '' }}
          # off: binaries leave CI only through the explicit tag-only upload below
          uploadWorkflowArtifacts: false

      # Tauri imports the certificate into a temporary keychain, signs KataGo then the app (hardened runtime, no
      # entitlements), notarizes and staples the app, then builds the DMG and the updater package from it and signs
      # them. The DMG is notarized and stapled here. The API key file exists only during this step.
      - name: Build, sign and notarize (macOS, tags only)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: GUARANI LLC (CN9TKA949C)"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Without credentials Tauri only warns and skips notarization: fail here instead.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            [ -n "${!name}" ] || { echo "::error::secret $name is missing from the release environment"; exit 1; }
          done
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH")
          unset APPLE_API_KEY_P8
          pnpm tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          [ ${#dmgs[@]} -eq 1 ] || { echo "::error::expected one DMG, found ${#dmgs[@]}"; exit 1; }
          xcrun notarytool submit "${dmgs[0]}" --wait \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER"
          xcrun stapler staple "${dmgs[0]}" # fails unless the DMG was accepted

      # No secrets here. Tauri ignores stapler's exit status, so check everything Gatekeeper will: the app, the
      # updater package's copy of it, KataGo inside it and the DMG.
      - name: Verify the signatures and notarization (macOS, tags only)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        run: |
          # Developer ID Application certificate of this team; -R="text" passes it as a requirement string, not a file.
          team='anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] exists'
          team+=' and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = "CN9TKA949C"'
          bundle=src-tauri/target/release/bundle
          check_app() { # app -> Developer ID, hardened runtime, notarized and stapled, KataGo signed the same way
            codesign --verify --deep --strict --verbose=2 -R="$team" "$1"
            spctl --assess --type execute -vv "$1" 2>&1 | tee /dev/stderr | grep -qxF 'source=Notarized Developer ID'
            xcrun stapler validate "$1"
            codesign --verify --strict --verbose=2 -R="$team" "$1/Contents/MacOS/katago"
            for code in "$1" "$1/Contents/MacOS/katago"; do
              codesign -dv "$code" 2>&1 | grep -q '^CodeDirectory .*flags=0x10000(runtime)' \
                || { echo "::error::$code: hardened runtime is off"; exit 1; }
            done
          }
          check_app "$bundle/macos/Masame.app"
          tarballs=("$bundle"/macos/*.app.tar.gz)
          [ ${#tarballs[@]} -eq 1 ] || { echo "::error::expected one .app.tar.gz, found ${#tarballs[@]}"; exit 1; }
          mkdir "$RUNNER_TEMP/updater" && tar -xzf "${tarballs[0]}" -C "$RUNNER_TEMP/updater"
          check_app "$RUNNER_TEMP/updater/Masame.app"
          for dmg in "$bundle"/dmg/*.dmg; do
            codesign --verify --strict --verbose=2 -R="$team" "$dmg"
            spctl --assess --type open --context context:primary-signature -vv "$dmg" 2>&1 | tee /dev/stderr \
              | grep -qxF 'source=Notarized Developer ID'
            xcrun stapler validate "$dmg"
          done

      # The AppImage bundles Ubuntu's WebKitGTK, GTK, GLib...: list them with their packages, versions and licences.
      - name: List the AppImage's bundled libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          [ ${#appimages[@]} -eq 1 ] || { echo "::error::expected one AppImage, found ${#appimages[@]}"; exit 1; }
          scripts/linux-appimage-libraries.sh "${appimages[0]}" src-tauri/target/release/bundle/appimage/linux-appimage-libraries.txt

      - name: Upload the DMG and the updater package (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: masame-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 7
      - name: Upload the installer (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: masame-windows
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 7
      - name: Upload the Linux packages (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: masame-linux
          # Several folders: the artifact keeps them under bundle/ (appimage/, deb/, rpm/); the release job flattens.
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/appimage/linux-appimage-libraries.txt
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7

  # Separate job so only this one, which runs no project code beyond reading files, can write to the repository.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the app version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-release
          merge-multiple: true

      - name: Flatten the artifacts
        working-directory: dist-release
        run: |
          # Artifacts with several folders arrive as subfolders: move every file to the top, refusing duplicates.
          find . -mindepth 2 -type f -exec mv -n -t . {} +
          find . -mindepth 1 -type d -delete

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign

      # Each updater package must verify against the public key the app ships (tauri.conf.json) and be signed for this
      # version (the signature's trusted comment, which the app also checks). Tauri stores the minisign public key and
      # each .sig as base64 of the whole minisign file; latest.json carries the .sig content as is.
      - name: Verify the updater signatures and write latest.json
        working-directory: dist-release
        run: |
          shopt -s nullglob
          jq -r .plugins.updater.pubkey ../src-tauri/tauri.conf.json | base64 -d > "$RUNNER_TEMP/updater.pub"
          platforms='{}'
          for entry in 'darwin-aarch64 *.app.tar.gz' 'windows-x86_64 *-setup.exe' 'linux-x86_64 *.AppImage'; do
            target=${entry%% *}
            # shellcheck disable=SC2206 # the glob is the point
            files=(${entry#* })
            if [ ${#files[@]} -ne 1 ] || [ ! -f "${files[0]}.sig" ]; then
              echo "::error::$target: expected one ${entry#* } with its .sig, found ${#files[@]} package(s)"
              exit 1
            fi
            file=${files[0]}
            base64 -d "$file.sig" > "$RUNNER_TEMP/$file.minisig"
            comment=$(minisign -V -Q -p "$RUNNER_TEMP/updater.pub" -m "$file" -x "$RUNNER_TEMP/$file.minisig")
            if ! tr '\t' '\n' <<< "$comment" | grep -qxF "version:$VERSION"; then
              echo "::error::$file is not signed for version $VERSION (trusted comment: $comment)"
              exit 1
            fi
            platforms=$(jq -c --arg t "$target" --arg sig "$(cat "$file.sig")" \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$file" \
              '.[$t] = {signature: $sig, url: $url}' <<< "$platforms")
          done
          jq -n --arg version "$VERSION" --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson platforms "$platforms" \
            --arg notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' > latest.json
          cat latest.json

      - name: Write checksums
        working-directory: dist-release
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Masame $VERSION" \
            --notes-file "docs/release-notes/$GITHUB_REF_NAME.md" \
            dist-release/*
