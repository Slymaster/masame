# Tests and builds for macOS (Apple Silicon: .app + .dmg, ad-hoc signed) and Windows x64 (NSIS installer, unsigned) on
# every push and pull request. On a v* tag push only, the DMG and installer are uploaded as workflow artifacts and the
# release job turns them into a draft GitHub release (with SHA256SUMS.txt) for the maintainer to review and publish by
# hand. Actions are pinned to commit SHAs (tag in the comment); pnpm's exact version comes from package.json's
# packageManager field.
name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build # dist/ must exist before cargo compiles the app (generate_context!)

      # The engine must be in place before cargo runs: tauri-build checks bundled binaries and resources.
      - name: Cache the KataGo build (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: katago-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-katago.sh') }}
      - name: Build KataGo (macOS, Metal)
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkg-config
          scripts/build-katago.sh
      - name: Fetch KataGo (Windows, official OpenCL + CPU builds)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-windows-engine.ps1

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }}
          # off: binaries leave CI only through the explicit tag-only upload below
          uploadWorkflowArtifacts: false

      - name: Upload the DMG (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: masame-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Upload the installer (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: masame-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  # Separate job so only this one, which runs no project code beyond reading files, can write to the repository.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the app version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-release
          merge-multiple: true

      - name: Write checksums
        working-directory: dist-release
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Masame $VERSION" \
            --notes-file "docs/release-notes/$GITHUB_REF_NAME.md" \
            dist-release/*
