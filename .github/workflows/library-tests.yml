name: Library deletion
on:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/src/library*'
      - 'tests/library-native/**'
      - '.github/workflows/library-tests.yml'
  push:
    branches: ['codex/delete-library-games']
permissions:
  contents: read
jobs:
  store:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - run: cargo test --locked --manifest-path tests/library-native/Cargo.toml
