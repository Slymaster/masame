<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baduk — Directions artistiques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Karla:wght@400;500;600&family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500&family=Zen+Old+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-ui);
  transition:background-color .6s ease,color .6s ease;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:var(--tex);opacity:var(--tex-o);mix-blend-mode:multiply;transition:opacity .6s}

/* ---------- themes ---------- */
body[data-theme=atelier]{
  --bg:#ECE4D6;--ink:#2A2118;--muted:#86766280;--muted:#857462;--rule:rgba(43,29,14,.13);--rule-2:rgba(43,29,14,.28);
  --accent:#7A2E22;--hover:rgba(122,46,34,.06);
  --f-title:'Cormorant Garamond',Georgia,serif;--f-ui:'Karla',system-ui,sans-serif;--f-jp:'Shippori Mincho',serif;
  --title-size:52px;--title-w:500;--title-style:italic;--sub-style:normal;--sub-size:17px;--sub-ls:.18em;--sub-tt:uppercase;
  --seg-bg:rgba(43,29,14,.05);--seg-on:#F7F2E8;--seg-shadow:0 1px 2px rgba(60,40,15,.14),0 0 0 1px rgba(60,40,15,.06);--seg-r:999px;--btn-r:999px;
  --switch-on:#7A2E22;
  --stone-b:radial-gradient(circle at 34% 30%,#6a6a70 0,#2c2c30 38%,#121214 80%);
  --stone-w:radial-gradient(circle at 34% 30%,#fffdf8 0,#f1ebdf 55%,#d7cdbb 100%);
  --tex:repeating-linear-gradient(0deg,rgba(110,85,50,.045) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(110,85,50,.035) 0 1px,transparent 1px 4px),var(--noise);--tex-o:.9;
}
body[data-theme=sumi]{
  --bg:#E8DFCC;--ink:#1E1B18;--muted:#7C7466;--rule:rgba(30,27,24,.12);--rule-2:rgba(30,27,24,.3);
  --accent:#B7372A;--hover:rgba(30,27,24,.05);
  --f-title:'Shippori Mincho',serif;--f-ui:'Shippori Mincho',serif;--f-jp:'Shippori Mincho',serif;
  --title-size:46px;--title-w:500;--title-style:normal;--sub-style:normal;--sub-size:16px;--sub-ls:.3em;--sub-tt:none;
  --seg-bg:transparent;--seg-on:#F3ECDD;--seg-shadow:0 0 0 1px rgba(30,27,24,.16);--seg-r:2px;--btn-r:2px;
  --switch-on:#1E1B18;
  --stone-b:radial-gradient(circle at 50% 50%,#38352f 0,#26231f 60%,#0d0c0b 100%);
  --stone-w:radial-gradient(circle,#fdfbf5 0,#fdfbf5 58%,#1e1b18 62%,#1e1b18 76%,transparent 79%);
  --tex:var(--noise);--tex-o:.85;
}
body[data-theme=karesansui]{
  --bg:#DCD5C8;--ink:#2E2924;--muted:#7D7468;--rule:rgba(46,41,36,.13);--rule-2:rgba(46,41,36,.3);
  --accent:#5E6B47;--hover:rgba(94,107,71,.08);
  --f-title:'Zen Old Mincho',serif;--f-ui:'Zen Kaku Gothic New',system-ui,sans-serif;--f-jp:'Zen Old Mincho',serif;
  --title-size:42px;--title-w:600;--title-style:normal;--sub-style:normal;--sub-size:15px;--sub-ls:.24em;--sub-tt:none;
  --seg-bg:rgba(46,41,36,.06);--seg-on:#ECE7DD;--seg-shadow:0 1px 3px rgba(46,41,36,.16);--seg-r:12px;--btn-r:12px;
  --switch-on:#5E6B47;
  --stone-b:radial-gradient(ellipse at 36% 32%,#625f59 0,#36332f 45%,#1b1a18 100%);
  --stone-w:radial-gradient(ellipse at 36% 32%,#f7f5f0 0,#e7e3da 60%,#c7c1b4 100%);
  --tex:var(--noise);--tex-o:1;
}

/* ---------- header ---------- */
.top{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 36px;height:76px}
.brand{display:flex;align-items:baseline;gap:12px;color:var(--muted);font-size:12.5px;letter-spacing:.04em}
.brand b{font-family:var(--f-jp);font-weight:500;font-size:20px;color:var(--ink);letter-spacing:0}
.brand span.name{font-family:var(--f-title);font-size:17px;color:var(--ink);letter-spacing:.02em}
.seg{position:relative;display:flex;padding:4px;border-radius:var(--seg-r);background:var(--seg-bg);box-shadow:inset 0 0 0 1px var(--rule);transition:background .6s}
.seg button{position:relative;z-index:1;border:0;background:none;font-family:var(--f-ui);font-size:13.5px;color:var(--muted);padding:9px 20px;cursor:pointer;display:flex;gap:9px;align-items:baseline;border-radius:var(--seg-r);transition:color .3s;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected=true]{color:var(--ink)}
.seg button:focus-visible{outline:1px solid var(--accent);outline-offset:-3px}
.seg .k{font-size:10px;opacity:.5;font-variant-numeric:tabular-nums;font-family:var(--f-ui)}
.seg .jp{font-family:var(--f-jp);font-size:12px;opacity:.6}
.seg-ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:var(--seg-r);background:var(--seg-on);box-shadow:var(--seg-shadow);transition:transform .5s cubic-bezier(.2,.8,.2,1),width .5s cubic-bezier(.2,.8,.2,1),background .6s,border-radius .6s}
.hint{justify-self:end;font-size:12px;color:var(--muted);display:flex;gap:14px;align-items:center}
kbd{font-family:var(--f-ui);font-size:10.5px;line-height:1;border:1px solid var(--rule-2);border-radius:4px;padding:2px 5px 3px;color:var(--muted);margin-right:4px}

/* ---------- stage ---------- */
.stage{display:flex;justify-content:center;align-items:center;gap:clamp(36px,4.5vw,84px);padding:4px 36px 28px;min-height:calc(100vh - 76px)}
.board-wrap{flex:none;line-height:0}
canvas{display:block;-webkit-tap-highlight-color:transparent}

/* ---------- panel ---------- */
.panel{width:330px;flex:none;display:flex;flex-direction:column;gap:28px}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.mark{flex:none;display:none}
body[data-theme=atelier] .mark.m-atelier{display:block;width:26px;height:1px;background:var(--accent)}
body[data-theme=sumi] .mark.m-sumi{display:grid;place-items:center;width:24px;height:24px;background:var(--accent);color:#F7EFE2;font-family:'Shippori Mincho',serif;font-size:14px;letter-spacing:0;border-radius:2px;transform:rotate(-2deg);box-shadow:inset 0 0 0 2px #B7372A,inset 0 0 0 3px rgba(247,239,226,.85)}
body[data-theme=karesansui] .mark.m-kare{display:block;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(94,107,71,.14)}
.title{margin-top:14px;font-family:var(--f-title);font-size:var(--title-size);font-weight:var(--title-w);font-style:var(--title-style);line-height:1;letter-spacing:-.005em;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.title .jp{font-family:var(--f-jp);font-style:normal;font-weight:400;font-size:.46em;color:var(--muted);letter-spacing:.14em}
.sub{margin-top:12px;font-family:var(--f-title);font-size:var(--sub-size);letter-spacing:var(--sub-ls);text-transform:var(--sub-tt);color:var(--accent)}
body[data-theme=atelier] .sub{font-family:var(--f-ui);font-size:11.5px;font-weight:600}
.mood{margin-top:14px;font-size:14.5px;line-height:1.65;color:var(--muted);max-width:32ch}
body[data-theme=atelier] .mood{font-family:var(--f-title);font-size:18px;line-height:1.45;font-style:italic;color:#6E5F4D}
.lab{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.lab span:last-child{letter-spacing:.06em;text-transform:none;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink)}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw div{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--ink);min-width:0}
.sw i{display:block;width:100%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06)}
body[data-theme=sumi] .sw i{border-radius:2px}
body[data-theme=karesansui] .sw i{border-radius:46% 54% 50% 50% / 52% 48% 52% 48%}
.sw small{font-size:9.5px;color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl{position:relative;display:grid;grid-template-columns:18px 1fr auto;gap:12px;align-items:center;padding:9px 0 9px 0;color:var(--muted);transition:color .3s}
.pl .st{width:16px;height:16px;border-radius:50%;box-shadow:1px 1.5px 2px rgba(0,0,0,.22)}
.pl .st.b{background:var(--stone-b)}
.pl .st.w{background:var(--stone-w)}
body[data-theme=sumi] .pl .st{box-shadow:none}
.pl .nm{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .nm em{font-style:normal;color:var(--muted);font-size:12.5px}
.pl .cp{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.pl.on{color:var(--ink)}
.pl::before{content:"";position:absolute;left:-14px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity .3s}
.pl.on::before{opacity:1}
body[data-theme=sumi] .pl::before{border-radius:0;width:5px;height:5px}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px;cursor:pointer;user-select:none}
.cap{font-size:11.5px;line-height:1.5;color:var(--muted);margin:0 0 10px;font-style:italic}
body[data-theme=karesansui] .cap{font-style:normal}
.sw-t{position:relative;width:38px;height:22px;border-radius:999px;border:0;background:var(--rule-2);cursor:pointer;transition:background .3s;flex:none}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#FBF8F2;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sw-t[aria-checked=true]{background:var(--switch-on)}
.sw-t[aria-checked=true]::after{transform:translateX(16px)}
body[data-theme=sumi] .sw-t,body[data-theme=sumi] .sw-t::after{border-radius:2px}
.sw-t:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
.acts{display:flex;gap:10px}
.btn{flex:1;padding:12px 14px;font-family:var(--f-ui);font-size:13.5px;letter-spacing:.02em;border:1px solid var(--rule-2);background:transparent;color:var(--ink);border-radius:var(--btn-r);cursor:pointer;transition:background .25s,border-color .25s}
.btn:hover{background:var(--hover);border-color:var(--accent)}
.btn:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.foot{font-size:11px;color:var(--muted);letter-spacing:.04em;line-height:1.6;padding-top:14px;border-top:1px solid var(--rule)}

@media (max-width:900px){
  .top{grid-template-columns:1fr;height:auto;gap:14px;justify-items:center;padding:18px 16px 6px}
  .hint{display:none}
  .seg button{padding:8px 12px;font-size:12.5px}
  .seg .jp{display:none}
  .stage{flex-direction:column;padding:12px 16px 32px;gap:32px;min-height:0}
  .panel{width:100%;max-width:560px}
}
</style>
</head>
<body data-theme="atelier">
<header class="top">
  <div class="brand"><b>碁</b><span class="name">Baduk</span><span>Direction artistique</span></div>
  <nav class="seg" role="tablist" aria-label="Direction artistique" id="seg">
    <span class="seg-ind" id="segInd"></span>
    <button role="tab" data-t="atelier"><span class="k">1</span>Atelier<span class="jp">工房</span></button>
    <button role="tab" data-t="sumi"><span class="k">2</span>Sumi<span class="jp">墨</span></button>
    <button role="tab" data-t="karesansui"><span class="k">3</span>Karesansui<span class="jp">枯山水</span></button>
  </nav>
  <div class="hint"><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd>direction</span><span><kbd>T</kbd>territoire</span></div>
</header>

<main class="stage">
  <div class="board-wrap"><canvas id="board" aria-label="Goban 19×19"></canvas></div>
  <aside class="panel">
    <div>
      <div class="eyebrow"><i class="mark m-atelier"></i><i class="mark m-sumi">碁</i><i class="mark m-kare"></i><span id="pNum">Direction I</span></div>
      <h1 class="title"><span id="pTitle">Atelier</span><span class="jp" id="pJp">工房</span></h1>
      <div class="sub" id="pSub">L'objet précieux</div>
      <p class="mood" id="pMood"></p>
    </div>
    <section>
      <div class="lab"><span>Palette</span><span></span></div>
      <div class="sw" id="sw"></div>
    </section>
    <section>
      <div class="lab"><span>Partie</span><span id="moveNo">Coup 24</span></div>
      <div class="pl" id="plB"><i class="st b"></i><span class="nm">Toi <em>· 8k</em></span><span class="cp"><span id="capB">0</span> prises</span></div>
      <div class="pl" id="plW"><i class="st w"></i><span class="nm">Hon'inbō Shūsaku <em>· style 1846</em></span><span class="cp"><span id="capW">0</span> prises</span></div>
    </section>
    <section>
      <div class="lab"><span>Affichage</span><span></span></div>
      <div class="row" id="rowTerr"><span>Territoire <kbd style="margin-left:6px">T</kbd></span><button class="sw-t" role="switch" id="togTerr" aria-checked="false" aria-label="Territoire"></button></div>
      <p class="cap">Simulation — le jeu utilisera l'estimation de KataGo.</p>
      <div class="row" id="rowSound"><span>Son</span><button class="sw-t" role="switch" id="togSound" aria-checked="true" aria-label="Son"></button></div>
    </section>
    <div class="acts"><button class="btn" id="undo">Annuler</button><button class="btn" id="reset">Réinitialiser</button></div>
    <div class="foot" id="pFoot"></div>
  </aside>
</main>

<script>
'use strict';
/* ================= data ================= */
const N = 19, HOSHI = [3, 9, 15];
const ORDER = ['atelier', 'sumi', 'karesansui'];
const THEMES = {
  atelier: {
    num: 'Direction I', title: 'Atelier', jp: '工房', sub: "L'objet précieux",
    mood: "Un goban de kaya dans la lumière chaude d'un après-midi. Des pierres que l'on garde un siècle.",
    swatches: [['Lin', '#ECE4D6'], ['Kaya', '#D8A85E'], ['Encre', '#2B1D0E'], ['Ardoise', '#1A1A1D'], ['Sang-de-bœuf', '#7A2E22']],
    foot: 'Cormorant Garamond · Karla — kaya masame, ardoise nachiguro, coquillage Hyuga.',
  },
  sumi: {
    num: 'Direction II', title: 'Sumi', jp: '墨', sub: 'Le lavis',
    mood: "Une partie peinte à l'encre sur washi. Chaque coup est un geste, chaque territoire un lavis qui se diffuse.",
    swatches: [['Washi', '#F3ECDD'], ['Gris lavis', '#8E877A'], ['Sumi', '#1C1A18'], ['Indigo', '#3E4F6B'], ['Vermillon', '#B7372A']],
    foot: 'Shippori Mincho — encre, papier, sceau.',
  },
  karesansui: {
    num: 'Direction III', title: 'Karesansui', jp: '枯山水', sub: 'Le jardin sec',
    mood: "Le gravier ratissé de Ryōan-ji. Les pierres sont posées ; l'influence se lit dans les sillons.",
    swatches: [['Gravier', '#E4DED2'], ['Argile', '#DCD5C8'], ['Engawa', '#4A3A2C'], ['Basalte', '#2A2826'], ['Mousse', '#5E6B47']],
    foot: 'Zen Old Mincho · Zen Kaku Gothic New — gravier, basalte, granit.',
  },
};
const SETUP = [[15,3],[3,15],[15,16],[3,3],[2,5],[2,9],[5,16],[5,15],[6,15],[4,15],[6,16],[16,2],[15,2],[16,3],[16,4],[17,4],[17,5],[15,1],[14,1],[16,1],[9,3],[16,13],[16,10],[9,16]];

/* ================= noise ================= */
function hash(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, -2048144777)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const stoneRng = (x, y, salt) => rng(Math.floor(hash(x, y, salt) * 4294967296)); // stable per intersection
const T1 = new Float32Array(4096); { const r = rng(7); for (let i = 0; i < 4096; i++) T1[i] = r(); }
function n1(u) { const i = Math.floor(u), f = u - i, a = T1[i & 4095], b = T1[(i + 1) & 4095]; return a + (b - a) * f * f * (3 - 2 * f); }
function vn2(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const sstep = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - t, 3);
const TAU = Math.PI * 2;

/* ================= rules ================= */
const idx = (x, y) => y * N + x;
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
function groupAt(b, p) {
  const c = b[p], stack = [p], seen = new Set(stack), libs = new Set(), stones = [];
  while (stack.length) {
    const q = stack.pop(); stones.push(q);
    const qx = q % N, qy = (q / N) | 0;
    for (const [dx, dy] of DIRS) {
      const nx = qx + dx, ny = qy + dy;
      if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
      const r = idx(nx, ny);
      if (b[r] === 0) libs.add(r); else if (b[r] === c && !seen.has(r)) { seen.add(r); stack.push(r); }
    }
  }
  return { stones, libs: libs.size };
}
// shortcut: no ko rule, add with real engine
function tryPlay(b, x, y, c) {
  const p = idx(x, y);
  if (b[p] !== 0) return null;
  const nb = b.slice(); nb[p] = c; let cap = 0;
  for (const [dx, dy] of DIRS) {
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
    const q = idx(nx, ny);
    if (nb[q] === -c) { const g = groupAt(nb, q); if (g.libs === 0) { for (const s of g.stones) nb[s] = 0; cap += g.stones.length; } }
  }
  if (groupAt(nb, p).libs === 0) return null; // suicide
  return { b: nb, cap };
}
(function selfTest() {
  const b = new Int8Array(N * N); b[idx(0, 0)] = 1; b[idx(1, 0)] = -1;
  const r = tryPlay(b, 0, 1, -1);
  console.assert(r && r.cap === 1 && r.b[idx(0, 0)] === 0, 'capture en coin');
  const s = new Int8Array(N * N); s[idx(1, 0)] = -1; s[idx(0, 1)] = -1;
  console.assert(tryPlay(s, 0, 0, 1) === null, 'suicide interdit');
  const t = new Int8Array(N * N); t[idx(0, 0)] = 1; t[idx(1, 0)] = 1; t[idx(2, 0)] = -1; t[idx(0, 1)] = -1;
  const u = tryPlay(t, 1, 1, -1);
  console.assert(u && u.cap === 2 && u.b[idx(0, 0)] === 0 && u.b[idx(1, 0)] === 0, 'capture de groupe');
  console.assert(tryPlay(t, 0, 0, -1) === null, 'case occupée');
  console.info('Baduk self-test: règles de capture OK');
})();
function ownership(b) {
  const f = new Float32Array(N * N), st = [];
  for (let p = 0; p < N * N; p++) if (b[p]) st.push([p % N, (p / N) | 0, b[p]]);
  const k = 1 / (2 * 1.8 * 1.8);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let s = 0; for (const [sx, sy, c] of st) { const dx = x - sx, dy = y - sy; s += c * Math.exp(-(dx * dx + dy * dy) * k); }
    f[idx(x, y)] = Math.tanh(s);
  }
  return f;
}

  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t0 + decay);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + decay + 0.02);
}
function playSound() {
  if (!sound) return;
  try { audio(); } catch (e) { return; }
  const t = AC.currentTime + 0.005;
  if (theme === 'atelier') { burst(t, 2500, 1.6, 0.045, 0.9); tone(t, 200, 150, 0.06, 0.45); }
  else if (theme === 'sumi') { burst(t, 900, 1.1, 0.08, 0.55); tone(t, 360, 280, 0.07, 0.16); }
  else {
    burst(t, 1200, 0.9, 0.15, 0.45); tone(t, 150, 110, 0.05, 0.2);
    const n = 2 + (Math.random() < 0.5 ? 1 : 0);
    for (let k = 0; k < n; k++) burst(t + 0.018 + Math.random() * 0.08, 2800 + Math.random() * 2600, 3, 0.014, 0.18);
  }
}

/* ================= UI ================= */
const $ = id => document.getElementById(id);
function updatePanel() {
  $('moveNo').textContent = `Coup ${st.moveNo}`;
  $('capB').textContent = st.capB; $('capW').textContent = st.capW;
  $('plB').classList.toggle('on', st.toPlay === 1); $('plW').classList.toggle('on', st.toPlay === -1);
  $('undo').disabled = history.length === 0;
}
function placeInd() {
  const b = document.querySelector(`.seg button[data-t=${theme}]`), ind = $('segInd');
  ind.style.width = b.offsetWidth + 'px'; ind.style.transform = `translateX(${b.offsetLeft}px)`;
}
function setTheme(t, first) {
  theme = t; document.body.dataset.theme = t;
  const d = THEMES[t];
  $('pNum').textContent = d.num; $('pTitle').textContent = d.title; $('pJp').textContent = d.jp; $('pSub').textContent = d.sub; $('pMood').textContent = d.mood; $('pFoot').textContent = d.foot;
  $('sw').innerHTML = d.swatches.map(([n, h]) => `<div><i style="background:${h}"></i><span>${n}</span><small>${h}</small></div>`).join('');
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === t));
  placeInd(); anim = null; G = geom(t); req();
  if (!first) canvas.animate([{ opacity: 0.25 }, { opacity: 1 }], { duration: 420, easing: 'ease-out' });
}
function setTerritory(v) { territory = v; $('togTerr').setAttribute('aria-checked', v); req(); }
function setSound(v) { sound = v; $('togSound').setAttribute('aria-checked', v); }
function resize() {
  const w = innerWidth, h = innerHeight;
  S = Math.max(280, Math.floor(w < 900 ? Math.min(w - 32, h * 0.92) : Math.min(h * 0.88, h - 100, w * 0.62, w - 470)));
  dpr = window.devicePixelRatio || 1;
  canvas.style.width = canvas.style.height = S + 'px';
  canvas.width = canvas.height = Math.round(S * dpr);
  texCache.clear(); cache = { texKey: '', tex: null, baseKey: '', base: null, stKey: '', stones: null };
  G = geom(theme); anim = null; placeInd(); req();
}
function pick(e) {
  const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const x = Math.round((mx - G.ox) / G.cell), y = Math.round((my - G.oy) / G.cell);
  if (x < 0 || y < 0 || x >= N || y >= N) return null;
  if (Math.hypot(mx - G.P[x], my - G.P[y]) > G.cell * 0.5) return null;
  return { x, y };
}
canvas.addEventListener('pointermove', e => {
  const h = pick(e), ok = h && !st.b[idx(h.x, h.y)];
  canvas.style.cursor = ok ? 'pointer' : 'default';
  const nh = ok ? h : null;
  if ((nh && hover && nh.x === hover.x && nh.y === hover.y) || (!nh && !hover)) return;
  hover = nh; req();
});
canvas.addEventListener('pointerleave', () => { hover = null; req(); });
canvas.addEventListener('click', e => {
  const h = pick(e); if (!h) return;
  const prevBase = cache.base, c = st.toPlay;
  if (!apply(h.x, h.y)) return;
  anim = { x: h.x, y: h.y, c, start: performance.now(), dur: R_[theme].dur, prevBase: theme === 'karesansui' ? prevBase : null, theme };
  hover = null; playSound(); updatePanel(); req();
});
$('undo').onclick = () => { if (!history.length) return; st = history.pop(); anim = null; updatePanel(); req(); };
$('reset').onclick = () => { st = setupState; history = setupHistory.slice(); anim = null; updatePanel(); req(); };
$('rowTerr').onclick = () => setTerritory(!territory);
$('rowSound').onclick = () => setSound(!sound);
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => setTheme(b.dataset.t));
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key >= '1' && e.key <= '3') setTheme(ORDER[+e.key - 1]);
  else if (e.key === 't' || e.key === 'T') setTerritory(!territory);
});
addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 120); });

// page grain (data URL generated once)
(function noise() {
  const c = mk(220, 220), x = c.getContext('2d'), im = x.createImageData(220, 220);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.random(); im.data[i] = im.data[i + 1] = im.data[i + 2] = 90; im.data[i + 3] = v < 0.5 ? v * 26 : 0; }
  x.putImageData(im, 0, 0); document.documentElement.style.setProperty('--noise', `url(${c.toDataURL()})`);
})();

// url params: ?theme=sumi&territoire=1&son=0
const Q = new URLSearchParams(location.search);
setTheme(ORDER.includes(Q.get('theme')) ? Q.get('theme') : 'atelier', true);
if (Q.get('territoire') === '1') setTerritory(true);
if (Q.get('son') === '0') setSound(false);
resize(); updatePanel();
document.fonts && document.fonts.ready.then(placeInd);
</script>
